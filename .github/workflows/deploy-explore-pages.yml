name: Deploy explore UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "WP1/explore/ui/**"
      - ".github/workflows/deploy-explore-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-explore-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WP1/explore/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: WP1/explore/ui/package-lock.json

      - name: Install and build
        env:
          VITE_BASE_PATH: /BH2026-23-single-cell/
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: WP1/explore/ui/dist
          clean: true
          single-commit: true
