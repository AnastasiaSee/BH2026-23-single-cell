name: Deploy explore UI to GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/duckdb-parquet-explore-9fd8
    paths:
      - "WP1/explore/ui/**"
      - ".github/workflows/deploy-explore-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-explore-ui
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WP1/explore/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: WP1/explore/ui/package-lock.json

      - name: Install and build
        env:
          VITE_BASE_PATH: /BH2026-23-single-cell/
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WP1/explore/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
